<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的工时本</title>
  <style>
    :root { --ink:#172525;--muted:#667674;--line:#dce6e1;--paper:#f6f8f5;--mint:#dff4e7;--green:#11735c;--dark:#0a4036; }
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.app{width:min(1080px,calc(100% - 28px));margin:auto;padding:26px 0 58px}.hero{padding:27px 30px 34px;color:white;background:var(--dark);border-radius:26px}.brand{font-weight:700;font-size:15px}.brand b{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border-radius:9px;color:var(--dark);background:var(--mint)}.intro{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-top:32px}.eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.1em}.hero .eyebrow{color:#91d7b8}h1{max-width:590px;margin:0 0 11px;font-size:clamp(30px,5vw,46px);line-height:1.12;letter-spacing:-.05em}h2{margin:0;font-size:23px;letter-spacing:-.03em}.sub{max-width:560px;margin:0;color:#c9dfd5;line-height:1.65;font-size:14px}.target{min-width:225px;padding:14px 16px;border:1px solid #4f8678;border-radius:15px;background:#174c40}.target label{display:block;margin-bottom:6px;color:#c9dfd5;font-size:12px}.target input{width:61px;padding:0;border:0;border-bottom:1px solid #b3dbc8;outline:0;color:white;background:transparent;font-size:18px;font-weight:700}.target small{margin-left:8px;color:#d7eee2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.card,.panel{border:1px solid var(--line);border-radius:20px;background:#fff}.card{min-height:138px;padding:20px}.card.mint{border-color:#bde6ce;background:var(--mint)}.label{margin:0 0 11px;color:var(--muted);font-size:13px}.value{display:block;margin-bottom:9px;font-size:28px;letter-spacing:-.05em}.mint .value{color:var(--dark)}.positive{color:var(--green)}.negative{color:#b84f3b}.hint{color:var(--muted);font-size:12px}.workspace{display:grid;grid-template-columns:1fr 260px;gap:20px}.panel{padding:26px}.heading{display:flex;justify-content:space-between;gap:12px;margin-bottom:22px}.pill{padding:6px 10px;align-self:start;border-radius:999px;color:var(--green);background:var(--mint);font-size:12px;font-weight:700}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}label span{display:block;margin-bottom:7px;color:#415450;font-size:13px;font-weight:700}input,textarea{width:100%;border:1px solid #cad8d2;border-radius:10px;outline:none;background:white;color:var(--ink);font:inherit}input{height:43px;padding:0 11px}textarea{padding:10px 11px;resize:vertical}input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #11735c20}.note{display:block;margin-top:15px}.preview{display:grid;grid-template-columns:1fr auto;gap:3px 15px;align-items:center;margin:19px 0;padding:14px 15px;border-radius:12px;background:#eef7f1}.preview span,.preview small{color:#54716a;font-size:12px}.preview strong{grid-row:span 2;color:var(--dark);font-size:20px}.actions{display:flex;justify-content:flex-end;gap:9px}button{min-height:41px;padding:0 15px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.primary{border:1px solid var(--green);color:white;background:var(--green)}.secondary,.export{border:1px solid var(--line);color:#31514a;background:white}.guide{color:#eaf9f1;background:#166351;border-color:#166351}.guide .eyebrow{color:#b4e4cc}.guide h2{margin-bottom:25px}.guide ol{display:grid;gap:17px;margin:0;padding:0;list-style:none}.guide li{display:grid;grid-template-columns:27px 1fr;gap:9px;align-items:center;color:#dcf2e7;font-size:13px;line-height:1.45}.guide li b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--dark);background:var(--mint);font-size:12px}.privacy{margin-top:29px;padding-top:15px;border-top:1px solid #ffffff38;color:#b7daca;font-size:12px;line-height:1.6}.records{margin-top:20px}.records-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}.table-wrap{overflow:auto}table{width:100%;min-width:690px;border-collapse:collapse}th{padding:0 10px 11px;border-bottom:1px solid var(--line);color:#72837f;text-align:left;font-size:11px;letter-spacing:.06em}td{padding:14px 10px;border-bottom:1px solid #edf2ef;color:#536560;font-size:13px}td strong{color:var(--ink)}.row-buttons{white-space:nowrap}.row-buttons button{min-height:auto;padding:0;border:0;color:var(--green);background:none;font-size:12px}.row-buttons button+button{margin-left:11px;color:#bc5e49}.empty{padding:44px 20px 30px;text-align:center}.empty i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 13px;border-radius:50%;color:var(--green);background:var(--mint);font-size:25px;font-style:normal}.empty h3{margin:0 0 7px}.empty p{margin:0;color:var(--muted);font-size:13px}@media(max-width:760px){.intro{display:block}.target{max-width:245px;margin-top:24px}.stats,.workspace{grid-template-columns:1fr}.guide{order:-1}.guide ol{grid-template-columns:repeat(3,1fr)}.guide li{grid-template-columns:1fr}.panel{padding:22px 17px}}@media(max-width:500px){.app{width:min(100% - 18px,1080px);padding-top:10px}.hero{padding:21px 19px 27px;border-radius:20px}.form-grid{grid-template-columns:1fr}.guide ol{grid-template-columns:1fr}.guide li{grid-template-columns:27px 1fr}.actions button{flex:1}.records-head{align-items:start;flex-direction:column}.export{width:100%}}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero"><div class="brand"><b>时</b>我的工时本</div><div class="intro"><div><p class="eyebrow">每天一笔，工时心中有数</p><h1>记录今天，掌握本月平均工时</h1><p class="sub">填写上下班时间后自动计算。所有数据仅保存在当前设备浏览器中。</p></div><div class="target"><label for="targetHours">公司要求平均工时</label><input id="targetHours" min="0" step="0.25" inputmode="decimal" type="number"><small>小时 / 天</small></div></div></section>
    <section class="stats"><article class="card mint"><p class="label">本月平均工时</p><strong class="value" id="average">暂无记录</strong><span class="hint" id="averageHint">录入第一天后开始统计</span></article><article class="card"><p class="label">与目标相比</p><strong class="value positive" id="difference">—</strong><span class="hint" id="differenceHint">记录第一天，开始积累本月数据</span></article><article class="card"><p class="label">本月累计工时</p><strong class="value" id="total">0小时00分</strong><span class="hint" id="count">0 条有效记录</span></article></section>
    <section class="workspace"><article class="panel"><div class="heading"><div><p class="eyebrow" id="entryEyebrow">快速录入</p><h2 id="entryTitle">添加当天工时</h2></div><span class="pill" id="todayPill" hidden>今天已记录</span></div><form id="workForm"><div class="form-grid"><label><span>日期</span><input id="date" type="date" required></label><label><span>上班时间</span><input id="startTime" type="time" required></label><label><span>下班时间</span><input id="endTime" type="time" required></label></div><label class="note"><span>备注（选填）</span><textarea id="note" placeholder="例如：调休、出差、加班项目…" rows="2"></textarea></label><div class="preview"><span>当天实际工时</span><strong id="todayHours">0小时00分</strong><small>按上下班时间自动计算</small></div><div class="actions"><button class="secondary" id="cancelEdit" type="button" hidden>取消修改</button><button class="primary" id="saveButton" type="submit">保存今天的记录</button></div></form></article><aside class="panel guide"><p class="eyebrow">使用提示</p><h2>只需三步</h2><ol><li><b>1</b>设定公司要求的每日平均工时</li><li><b>2</b>每天填入上下班时间</li><li><b>3</b>随时查看本月平均与目标差距</li></ol><div class="privacy">数据保存在本机浏览器。建议定期导出备份。</div></aside></section>
    <section class="panel records"><div class="records-head"><div><p class="eyebrow">工时明细</p><h2>所有记录</h2></div><button class="export" id="exportButton" type="button">导出 CSV</button></div><div id="recordsArea"></div></section>
  </main>
  <script>
    const KEY='my-work-hours-records', TARGET='my-work-hours-target';
    const $=id=>document.getElementById(id); let records=[], editingId=null;
    const today=()=>{const d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)};
    const minutes=time=>{const [h,m]=time.split(':').map(Number);return h*60+m};
    const work=r=>{if(!r.startTime||!r.endTime)return 0;let value=minutes(r.endTime)-minutes(r.startTime);if(value<0)value+=1440;return value};
    const duration=value=>`${Math.floor(value/60)}小时${String(Math.round(value%60)).padStart(2,'0')}分`;
    const decimal=value=>(value/60).toFixed(2);
    const dateText=value=>{const [y,m,d]=value.split('-');return `${y}年${Number(m)}月${Number(d)}日`};
    function reset(){editingId=null;$('date').value=today();$('startTime').value='09:00';$('endTime').value='18:00';$('note').value='';$('entryEyebrow').textContent='快速录入';$('entryTitle').textContent='添加当天工时';$('saveButton').textContent='保存今天的记录';$('cancelEdit').hidden=true;preview()}
    function save(){localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(TARGET,$('targetHours').value)}
    function preview(){const item={startTime:$('startTime').value,endTime:$('endTime').value};$('todayHours').textContent=duration(work(item))}
    function render(){const month=today().slice(0,7), set=records.filter(r=>r.date.slice(0,7)===month), total=set.reduce((n,r)=>n+work(r),0), avg=set.length?Math.round(total/set.length):0,target=Math.max(0,Number($('targetHours').value||0)*60),diff=avg-target;$('average').textContent=set.length?duration(avg):'暂无记录';$('averageHint').textContent=set.length?`${set.length} 个工作日的平均值`:'录入第一天后开始统计';$('total').textContent=duration(total);$('count').textContent=`${set.length} 条有效记录`;$('difference').textContent=!set.length?'—':diff===0?'持平':`${diff>0?'+':'-'}${decimal(Math.abs(diff))} 小时`;$('difference').className=`value ${diff<0?'negative':'positive'}`;$('differenceHint').textContent=!set.length?'记录第一天，开始积累本月数据':diff===0?'刚好达到目标平均工时':`${diff>0?'高于':'低于'}目标 ${duration(Math.abs(diff))}`;$('todayPill').hidden=!records.some(r=>r.date===today());const rows=[...records].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td><strong>${dateText(r.date)}</strong></td><td>${r.startTime} — ${r.endTime}</td><td><strong>${duration(work(r))}</strong></td><td>${escapeHtml(r.note)||'—'}</td><td class="row-buttons"><button onclick="editRecord('${r.id}')">编辑</button><button onclick="deleteRecord('${r.id}')">删除</button></td></tr>`).join('');$('recordsArea').innerHTML=rows?`<div class="table-wrap"><table><thead><tr><th>日期</th><th>上下班</th><th>实际工时</th><th>备注</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty"><i>⌁</i><h3>还没有工时记录</h3><p>从上面的表单开始，记录你的第一个工作日吧。</p></div>';save()}
    function escapeHtml(value){return String(value||'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
    window.editRecord=id=>{const r=records.find(item=>item.id===id);if(!r)return;editingId=id;$('date').value=r.date;$('startTime').value=r.startTime;$('endTime').value=r.endTime;$('note').value=r.note;$('entryEyebrow').textContent='正在修改记录';$('entryTitle').textContent='修改当天工时';$('saveButton').textContent='保存修改';$('cancelEdit').hidden=false;preview();scrollTo({top:0,behavior:'smooth'})};
    window.deleteRecord=id=>{if(confirm('确定删除这条工时记录吗？')){records=records.filter(r=>r.id!==id);if(editingId===id)reset();render()}};
    $('workForm').addEventListener('submit',event=>{event.preventDefault();const data={id:editingId||crypto.randomUUID(),date:$('date').value,startTime:$('startTime').value,endTime:$('endTime').value,note:$('note').value};records=records.filter(r=>r.id!==editingId&&r.date!==data.date);records.push(data);reset();render()});
    ['startTime','endTime'].forEach(id=>$(id).addEventListener('input',preview));$('targetHours').addEventListener('input',render);$('cancelEdit').addEventListener('click',reset);$('exportButton').addEventListener('click',()=>{if(!records.length)return;const rows=[['日期','上班','下班','实际工时（小时）','备注'],...records.map(r=>[r.date,r.startTime,r.endTime,decimal(work(r)),r.note])];const text='\uFEFF'+rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));link.download='我的工时记录.csv';link.click();URL.revokeObjectURL(link.href)});
    try{records=JSON.parse(localStorage.getItem(KEY)||'[]');$('targetHours').value=localStorage.getItem(TARGET)||'8'}catch{records=[];$('targetHours').value='8'}reset();render();
  </script>
</body>
</html>
